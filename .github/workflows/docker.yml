name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name (GHCR rejects uppercase)
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image tag for verification
        id: verify
        run: |
          # Use the first tag produced by metadata-action for the verification run.
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1 | tr -d ' ' | sed 's/.*://')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.image.outputs.name }}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify image starts and /healthz responds
        run: |
          docker run -d --name comic-scraper-ghci-test -p 18080:8080 \
            -e DATA_DIR=/data -e HOST=0.0.0.0 \
            ${{ steps.verify.outputs.image }}
          for i in {1..30}; do
            if curl -fsS http://localhost:18080/healthz; then
              echo "Health check passed"
              break
            fi
            sleep 2
            if [ "$i" = "30" ]; then
              echo "Health check failed"
              docker logs comic-scraper-ghci-test || true
              docker stop comic-scraper-ghci-test || true
              docker rm comic-scraper-ghci-test || true
              exit 1
            fi
          done

      - name: Verify Playwright driver and Chromium launch (headed, Xvfb)
        run: |
          # Exercises the real browser path inside the Debian runtime: the
          # playwright-go driver (node + package/cli.js), the bundled
          # chromium-1200 under Xvfb. Catches CDN/driver regressions that
          # /healthz alone cannot see.
          docker exec comic-scraper-ghci-test bash -c '
            set -e
            /opt/ms-playwright-go/node /opt/ms-playwright-go/package/cli.js --version | grep -q 1.57.0
            test -d /ms-playwright/chromium-1200
            Xvfb :98 -screen 0 1280x720x24 -nolisten tcp >/dev/null 2>&1 &
            sleep 1
            DISPLAY=:98 /opt/ms-playwright-go/node /opt/ms-playwright-go/package/cli.js --help >/dev/null
            echo "Playwright driver + chromium present; Xvfb starts"
          '
          docker stop comic-scraper-ghci-test
          docker rm comic-scraper-ghci-test